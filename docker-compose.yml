services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: vibe-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle   # SYS/SYSTEM 비밀번호
      APP_USER: vibe            # FREEPDB1 에 자동 생성되는 앱 계정
      APP_USER_PASSWORD: vibe
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  oracle-data:
